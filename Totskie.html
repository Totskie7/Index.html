<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />
<meta http-equiv="pragma" content="no-cache" />
<title>Investor Dashboard</title>
</head>
<body style="background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px;">

<h2>Investment 30-Days Contract</h2>
<p style="font-size: 0.9rem; color: #aaa;">Aktibong Puhunan: <span id="display-capital" style="color: white; font-weight: bold;">₱0.00</span></p>

<!-- SECRET CHANGER: Long press mo ito nang 2 seconds para lumabas ang Admin Control -->
<p id="secret-text" style="font-size: 0.9rem; color: #aaa; user-select: none; cursor: pointer;">Live na Tubo (Profit Only):</p>

<div id="live-balance" style="color: #4caf50; font-weight: bold; font-size: 2.2rem; margin: 10px 0; font-family: monospace;">₱0.0000</div>

<!-- MGA BUTTON NG USER -->
<div style="display: flex; gap: 10px; justify-content: center; max-width: 300px; margin: 20px auto;">
<button style="flex: 1; padding: 12px; font-weight: bold; background-color: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="userTopUpDirect()">Top-Up Link</button>
<button style="flex: 1; padding: 12px; font-weight: bold; background-color: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;" onclick="alert('Cash-Out Notification: Mag-send ng mensahe sa Admin para iproseso ang pag-withdraw ng iyong tubo.')">Cash-Out Link</button>
</div>

<!-- BOX NG ADMIN CONTROL -->
<div id="admin-box" style="display: none; margin: 25px auto; border: 2px dashed #ff9800; padding: 20px; max-width: 300px; background-color: #1a1a24; border-radius: 8px; box-sizing: border-box;">
<h3 style="color: #ff9800; margin: 0 0 15px 0;">🛠️ ADMIN CONTROL</h3>

<label style="font-size: 0.8rem; color: #aaa; display: block; text-align: left; margin-bottom: 5px;">1. I-set ang Capital (Simula sa Zero):</label>
<input type="number" id="admin-capital" placeholder="Puhunan hal. 1000" style="width: 100%; padding: 10px; margin-bottom: 10px; background: black; color: white; border: 1px solid #444; box-sizing: border-box; border-radius: 4px;">
<button onclick="adminSetCapital()" style="width: 100%; padding: 10px; font-weight: bold; background-color: #ff9800; color: black; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px;">I-UPDATE CAPITAL</button>

<hr style="border: 1px solid #2a2a2a; margin: 10px 0;">

<label style="font-size: 0.8rem; color: #aaa; display: block; text-align: left; margin-bottom: 5px;">2. Dagdag/Bawas sa Tubo:</label>
<input type="number" id="admin-adjust" placeholder="Halaga (gagamit ng - kung bawas)" style="width: 100%; padding: 10px; margin-bottom: 10px; background: black; color: white; border: 1px solid #444; box-sizing: border-box; border-radius: 4px;">
<button onclick="adminAdjustProfit()" style="width: 100%; padding: 10px; font-weight: bold; background-color: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer;">I-ADJUST TUBO</button>
</div>

<script>
const GCASH_NUMBER = "09512947856";

// BAGONG FEATURE: Babasahin nito kung may 'puhunan' sa dulo ng link
const urlParams = new URLSearchParams(window.location.search);
const puhunanMulaSaLink = parseFloat(urlParams.get('puhunan'));

let capital = parseFloat(localStorage.getItem('inv_capital')) || 0;

// Kung may nakasulat na puhunan sa link, iyon ang ipipilit nitong gamitin at i-save
if (!isNaN(puhunanMulaSaLink) && puhunanMulaSaLink >= 0) {
    capital = puhunanMulaSaLink;
    localStorage.setItem('inv_capital', capital);
}

let runningProfit = parseFloat(localStorage.getItem('inv_profit')) || 0;
let hulingOras = parseInt(localStorage.getItem('inv_timestamp')) || Date.now();

function kwentahinKita() {
const ngayon = Date.now();
const lumipas = Math.floor((ngayon - hulingOras) / 60000);
if (lumipas > 0 && capital > 0) {
runningProfit += (lumipas * ((capital * 0.05) / 1440));
hulingOras += (lumipas * 60000);
localStorage.setItem('inv_profit', runningProfit);
localStorage.setItem('inv_timestamp', hulingOras);
}
document.getElementById('live-balance').innerText = "₱" + runningProfit.toFixed(4);
document.getElementById('display-capital').innerText = "₱" + capital.toFixed(2);
}

setInterval(kwentahinKita, 60000);
kwentahinKita();

function userTopUpDirect() {
let halaga = prompt("Magkano ang i-to-top up mo bilang Capital (PHP)?:", "1000");
if (halaga === null || halaga.trim() === "" || isNaN(halaga)) return;

alert(
"--- GCASH PAYMENT DETAILS ---\n\n" +
"Mangyaring mag-send ng ₱" + halaga + " sa GCash account sa ibaba:\n\n" +
"GCash Number: " + GCASH_NUMBER + "\n" +
"GCash Name: ADMIN ACCOUNT\n\n" +
"PAALALA: I-screenshot ang resibo at i-send sa Admin upang ma-verify at ma-approve ang iyong account!"
);
}

let timer;
const secretText = document.getElementById('secret-text');

secretText.addEventListener('mousedown', simulanPindot);
secretText.addEventListener('touchstart', simulanPindot);
secretText.addEventListener('mouseup', ihintoPindot);
secretText.addEventListener('mouseleave', ihintoPindot);
secretText.addEventListener('touchend', ihintoPindot);

function simulanPindot() { timer = setTimeout(buksanAdmin, 2000); }
function ihintoPindot() { clearTimeout(timer); }

function buksanAdmin() {
let pw = prompt("Ipasok ang Admin Password:");
if (pw === "admin") {
document.getElementById('admin-box').style.display = 'block';
alert("Access Granted!");
} else if (pw !== null) {
alert("Mali!");
}
}

function adminSetCapital() {
let val = parseFloat(document.getElementById('admin-capital').value);
if (isNaN(val) || val < 0) return alert("Maling halaga!");
capital = val;
runningProfit = 0; 
hulingOras = Date.now();

localStorage.setItem('inv_capital', capital);
localStorage.setItem('inv_profit', runningProfit);
localStorage.setItem('inv_timestamp', hulingOras);

kwentahinKita();
alert("Capital ay pinalitan sa ₱" + capital.toFixed(2));
document.getElementById('admin-capital').value = "";
}

function adminAdjustProfit() {
let val = parseFloat(document.getElementById('admin-adjust').value);
if (isNaN(val)) return alert("Maling halaga!");

runningProfit += val;
if (runningProfit < 0) runningProfit = 0;

localStorage.setItem('inv_profit', runningProfit);
kwentahinKita();
alert("Ang tubo ay na-adjust ng ₱" + val.toFixed(4));
document.getElementById('admin-adjust').value = "";
}
</script>
</body>
</html>
